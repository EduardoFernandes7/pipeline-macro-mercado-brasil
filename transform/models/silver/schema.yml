version: 2

models:
  - name: stg_macro_indicators
    description: Cleaned, deduplicated Banco Central macro series (long format).
    columns:
      - name: date
        tests: [not_null]
      - name: series
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["selic_daily", "ipca_monthly", "usd_brl"]
      - name: value
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, series]

  - name: stg_market_prices
    description: Cleaned, deduplicated daily OHLCV for the 4 tracked B3 tickers.
    columns:
      - name: date
        tests: [not_null]
      - name: ticker
        tests: [not_null]
      - name: close
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, ticker]
